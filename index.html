<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<title>The Site Hit by Nature’s Wrath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--font:'Nunito','Segoe UI',Tahoma,Arial,sans-serif;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05060a;font-family:var(--font);touch-action:none;user-select:none;-webkit-user-select:none;cursor:none;-webkit-tap-highlight-color:transparent}
body.end,body.end *{cursor:auto}
button{font-family:inherit}

/* ---------- stage + crossfading scenes ---------- */
#stage{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:#05060a}
#stage[data-s="4"]{transition:transform .9s var(--ease)}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 180px rgba(0,0,0,.45);transition:opacity .8s}
#stage[data-s="0"]::after{opacity:0}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1s var(--ease);overflow:hidden}
.b0{background:radial-gradient(60% 50% at 12% 8%,#cfdcff,transparent 70%),radial-gradient(50% 50% at 92% 18%,#ffdcee,transparent 70%),radial-gradient(60% 60% at 50% 105%,#d2f6e8,transparent 70%),#f4f6ff}
.b0::before,.b0::after{content:'';position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.b0::before{background:#a5b4ff;left:-14vmax;top:-14vmax}
.b0::after{background:#ffb8d9;right:-16vmax;bottom:-18vmax;animation-delay:-6s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.b1{background:radial-gradient(ellipse at 80% 12%,#9fb3d1,transparent 55%),linear-gradient(#1f2b44,#5d7394 55%,#a7b7c9)}
.b2{background:radial-gradient(circle at 50% 115%,#1f2652,#05060a 70%)}
.b3{background:radial-gradient(circle at 50% 0,#fff,transparent 55%),linear-gradient(#c4ecff,#5aaee6)}
.b4{background:linear-gradient(#ffd89b,#8fd0ff 38%,#2f78b8)}
.b5{background:radial-gradient(circle at 50% 105%,#ff5a1f,transparent 55%),linear-gradient(#1a0505,#5a1408)}
.b6{background:linear-gradient(#27356b 0%,#6b5fa8 26%,#e98aa0 52%,#ffc58f 72%,#ffe9b8 100%)}
#stage[data-s="0"] .b0,#stage[data-s="1"] .b1,#stage[data-s="2"] .b2,#stage[data-s="3"] .b3,#stage[data-s="4"] .b4,#stage[data-s="5"] .b5,#stage[data-s="6"] .b6{opacity:1}
canvas{position:absolute;inset:0;width:100%;height:100%}

@keyframes sw{from{filter:brightness(1.9) blur(8px) saturate(1.7)}to{filter:none}}
#stage.sw{animation:sw .7s ease-out}
@keyframes pun{30%{scale:1.05;rotate:-.6deg}}
#stage.pun{animation:pun .35s}
#stage.gl{filter:invert(1) hue-rotate(180deg)}
#alarmfx{position:absolute;inset:0;opacity:0;background:radial-gradient(circle,transparent 30%,#ff1f3d 130%)}
@keyframes al{50%{opacity:.6}}
#stage.alarm #alarmfx{animation:al .5s 4}

/* ---------- fake "stability test" card ---------- */
#cap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,90vw);height:310px;padding:24px 20px;text-align:center;color:#1b2140;background:rgba(255,255,255,.7);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 40px 90px -30px rgba(60,70,160,.45),inset 0 1px 0 #fff}
#cap .ck{width:62px;height:62px;margin:0 auto 10px;border-radius:20px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#6a8dff,#a66bff);box-shadow:0 14px 30px -8px rgba(106,141,255,.75)}
#cap h2{font-size:21px;font-weight:800}
#cap p{font-size:14.5px;color:#58617f;margin-top:4px}
#cap small{position:absolute;bottom:14px;left:0;right:0;font-size:11px;color:#9aa0bb}
#cap.fall{transition:transform 1.3s cubic-bezier(.6,-.3,.9,.6),opacity 1.3s;transform:translate(-50%,150vh) rotate(28deg);opacity:0}

/* ---------- the button (real + decoys) ---------- */
#bw{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.fkw{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
#btn,.fk{position:absolute;left:-75px;top:-28px;width:150px;height:56px;border:0;border-radius:999px;color:#fff;font:800 17px var(--font);text-shadow:0 1px 2px rgba(0,0,0,.35);background:linear-gradient(180deg,#63f0a8,#17b068);box-shadow:0 6px 0 #0d8049,0 16px 30px -8px rgba(23,176,104,.65),inset 0 2px 0 rgba(255,255,255,.65);transition:background .5s,box-shadow .5s}
@keyframes wob{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(4deg) scale(1.07)}}
#stage:not([data-s="0"]) #btn,.fk{background:linear-gradient(180deg,#ff8f6e,#e5384f);box-shadow:0 6px 0 #9a1f36,0 0 34px rgba(255,93,108,.65),inset 0 2px 0 rgba(255,255,255,.55);animation:wob .45s infinite alternate ease-in-out}
#stage[data-s="5"] #btn,#stage[data-s="5"] .fk{animation-duration:.12s}
#bub{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:max-content;max-width:230px;text-align:center;background:#fff;color:#1b2140;padding:7px 14px;border-radius:14px;font-size:14px;font-weight:700;line-height:1.5;box-shadow:0 8px 24px -6px rgba(0,0,0,.45);display:none}
#bub::after{content:'';position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}

/* ---------- ice cube ---------- */
#cube{position:absolute;left:-104px;top:-56px;width:208px;height:112px;border-radius:22px;display:none;background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(160,215,255,.35) 55%,rgba(255,255,255,.55));border:1.5px solid rgba(255,255,255,.9);box-shadow:inset 0 0 26px rgba(255,255,255,.9),inset 0 -10px 24px rgba(120,190,255,.5),0 14px 40px -8px rgba(100,180,255,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .25s}
#cube::before{content:'';position:absolute;top:9px;left:14px;width:36%;height:10px;border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.95),transparent)}
#cube svg{position:absolute;inset:0;width:100%;height:100%}
#cube .cr{fill:none;stroke:#2b6e9e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
#frost{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(215,242,255,.55) 100%);box-shadow:inset 0 0 100px 30px rgba(210,240,255,.9)}

/* ---------- darkness / lightning ---------- */
#dark{position:absolute;inset:0;display:none;opacity:1;transition:opacity .25s;--x:50%;--y:50%;--r:80px;background:radial-gradient(circle var(--r) at var(--x) var(--y),transparent 0%,rgba(0,8,20,.55) 55%,rgba(0,0,0,.985) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#bolt{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
#bolt path{fill:none;stroke:#fff;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 8px #8cf) drop-shadow(0 0 22px #6af)}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(10,14,30,.62);border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:13.5px;box-shadow:0 6px 20px -8px rgba(0,0,0,.5)}
.chip b{font-weight:900}
.dots{display:flex;gap:4px}
.dots i{display:block;width:14px;height:5px;border-radius:5px;background:rgba(255,255,255,.28)}
.dots i.d{background:#fff}
.dots i.a{background:#ffd23f;box-shadow:0 0 8px #ffd23f}
#o2{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);width:min(280px,72vw);height:22px;border-radius:999px;background:rgba(5,25,60,.55);border:1px solid rgba(255,255,255,.35);overflow:hidden;display:none}
#o2 i{position:absolute;top:0;bottom:0;left:0;width:100%;background:linear-gradient(90deg,#2fd0ff,#7ee8ff);border-radius:inherit;transition:background .3s}
#o2.low i{background:linear-gradient(90deg,#ff4d6d,#ff9a56)}
#o2 span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}

/* ---------- stage title splash ---------- */
#splash{position:absolute;left:0;right:0;top:20%;text-align:center;color:#fff;pointer-events:none;opacity:0;text-shadow:0 6px 40px rgba(0,0,0,.55)}
#splash small{display:block;font-size:15px;font-weight:700;opacity:.85}
#splash b{display:block;font-size:clamp(34px,9vw,72px);font-weight:900;line-height:1.25}
#stage[data-s="3"] #splash{color:#0c3a63;text-shadow:0 4px 30px rgba(255,255,255,.7)}
#splash.go{animation:spl 1.9s var(--ease) forwards}
@keyframes spl{0%{opacity:0;transform:scale(1.25) translateY(10px);filter:blur(12px)}18%{opacity:1;transform:none;filter:none}72%{opacity:1}100%{opacity:0;transform:scale(.96) translateY(-14px)}}

/* ---------- cursor ---------- */
.cursor{position:absolute;left:-2px;top:-2px;width:26px;height:34px;transform-origin:2px 2px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));will-change:transform}

/* ---------- small effects ---------- */
.pop{position:absolute;padding:5px 12px;border-radius:999px;background:rgba(15,18,40,.84);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:15px;white-space:nowrap;pointer-events:none;animation:pp .95s var(--ease) forwards}
@keyframes pp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-220%) scale(.96)}}
.rip{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 12px rgba(255,255,255,.6);pointer-events:none;animation:rp .55s ease-out forwards}
@keyframes rp{to{transform:scale(7);opacity:0}}
.eye{position:absolute;filter:drop-shadow(0 0 14px #f33);animation:ey 1.1s forwards;pointer-events:none}
@keyframes ey{0%,100%{opacity:0}20%,75%{opacity:1}}
.deb{position:absolute;left:0;top:0;padding:8px 16px;border-radius:12px;background:rgba(255,255,255,.92);color:#1b2140;font-weight:800;white-space:nowrap;box-shadow:0 10px 24px -6px rgba(0,0,0,.6)}
.adw{position:absolute;left:0;top:0;width:210px;height:128px;pointer-events:none}
.ad{position:relative;width:100%;height:100%;padding:36px 12px 0;border-radius:20px;text-align:center;font-weight:800;font-size:15px;line-height:1.7;color:#2b1b00;background:linear-gradient(160deg,#fff3b0,#ffc83d);border:2px solid #fff;box-shadow:0 20px 50px -10px rgba(0,0,0,.7);animation:adin .45s var(--spring)}
@keyframes adin{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
.ad i{position:absolute;top:6px;right:8px;width:28px;height:28px;border-radius:50%;background:#1b1e36;color:#fff;font-style:normal;font-size:13px;line-height:28px}
.ad em{position:absolute;top:10px;left:14px;font-style:normal;font-size:10px;font-weight:700;opacity:.55}
.bsod{position:fixed;inset:0;z-index:90;background:#0b6fd6;color:#fff;padding:8vw;font-size:clamp(18px,4vw,30px);line-height:1.8;pointer-events:none;animation:bs 1.8s forwards}
.bsod .sad{font-size:15vw;line-height:1.1}
@keyframes bs{0%,88%{opacity:1}100%{opacity:0}}

/* ---------- message toast ---------- */
#msg{position:fixed;left:50%;top:50%;z-index:50;width:min(520px,90vw);overflow:hidden;border-radius:28px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),rgba(12,15,32,.84);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);color:#fff;font-size:clamp(17px,4.2vw,23px);font-weight:700;line-height:1.75;box-shadow:0 40px 90px -20px rgba(0,0,0,.8),0 0 80px -10px var(--ac,#ffd23f);opacity:0;pointer-events:none;transform:translate(-50%,-40%) scale(.85);transition:opacity .3s,transform .55s var(--spring)}
#msg.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.mh{display:flex;align-items:center;gap:12px;padding:12px 20px;background:linear-gradient(90deg,var(--ac),transparent);color:#101326;font-size:15px;font-weight:900}
.mh b{font-size:32px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
#msg p{padding:18px 24px 6px;text-align:center}
#msg u{display:block;height:4px;margin:12px 24px 16px;border-radius:4px;background:var(--ac);transform-origin:left;animation:bar linear forwards;text-decoration:none}
@keyframes bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ---------- end report ---------- */
#end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;overflow:auto;touch-action:auto;z-index:60;background:radial-gradient(circle at 50% 30%,rgba(255,170,90,.18),rgba(5,6,16,.72));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card{position:relative;width:min(480px,100%);padding:28px 20px 20px;border-radius:32px;text-align:center;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),rgba(14,16,36,.84);border:1px solid rgba(255,255,255,.2);box-shadow:0 40px 100px -20px rgba(0,0,0,.85),0 0 90px -20px #ff9a3c;overflow:hidden;animation:cin .8s var(--spring)}
@keyframes cin{from{opacity:0;transform:translateY(60px) scale(.85)}}
.card::before{content:'';position:absolute;inset:-50% -20% auto;height:100%;background:radial-gradient(circle,rgba(255,210,63,.32),transparent 60%);pointer-events:none}
.card>*{position:relative}
.card small{display:block;font-size:12px;color:#a9aed0}
.card h1{font-size:clamp(23px,6vw,30px);font-weight:900;margin:10px 0 14px;line-height:1.4;background:linear-gradient(90deg,#ffd23f,#ff7a1a 55%,#ff4d6d);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl{display:inline-block;padding:8px 22px;border-radius:999px;margin-bottom:18px;font-weight:900;font-size:17px;color:#2a1500;background:linear-gradient(135deg,#ffd23f,#ff9f1c);box-shadow:0 10px 30px -6px rgba(255,159,28,.7)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.g div{padding:12px 8px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:12.5px;color:#c5c9ea}
.g div i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.g b{display:block;font-size:25px;color:#fff;font-weight:900;line-height:1.3}
.loss{padding:12px;margin-bottom:16px;border-radius:18px;background:linear-gradient(135deg,rgba(255,77,109,.22),rgba(255,122,26,.14));border:1px solid rgba(255,77,109,.4);font-size:12.5px;color:#ffd0d0}
.loss b{display:block;font-size:30px;color:#ff9a9a;font-weight:900}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.acts button{font:800 15px var(--font);color:#fff;border:0;border-radius:16px;padding:13px 18px;background:linear-gradient(135deg,#4facfe,#2a6cf0);box-shadow:0 10px 24px -8px rgba(42,108,240,.8);transition:transform .35s var(--spring),filter .2s}
.acts button:hover{filter:brightness(1.12)}
.acts button.r{background:linear-gradient(135deg,#ff6a3d,#e0245e);box-shadow:0 10px 24px -8px rgba(224,36,94,.8)}
#btn,.fk{scale:var(--bs,1);transition:background .5s,box-shadow .5s,scale .3s var(--spring)}
</style>
</head>
<body>
<div id="stage" data-s="0">
  <div class="bg b0"></div><div class="bg b1"></div><div class="bg b2"></div><div class="bg b3"></div><div class="bg b4"></div><div class="bg b5"></div><div class="bg b6"></div>
  <canvas id="c"></canvas>
  <div id="cap">
    <div class="ck">🛡️</div>
    <h2>Browser Stability Test</h2>
    <p>Calmly click the green button to continue</p>
    <small>Protected by StableCheck™ · Privacy · Terms</small>
  </div>
  <div id="deb"></div>
  <div id="frost"></div>
  <div id="bw">
    <div id="bub"></div>
    <div id="cube"><svg viewBox="0 0 208 112"><path class="cr" d="M104 6 L96 30 L112 48 L98 70"/><path class="cr" d="M20 40 L52 52 L66 80"/><path class="cr" d="M190 30 L160 52 L150 90"/><path class="cr" d="M60 108 L84 84 L120 92 L140 106"/><path class="cr" d="M30 14 L70 30 L90 20 M170 100 L140 74"/></svg></div>
    <button id="btn">Continue</button>
  </div>
  <div id="dark"></div><div id="flash"></div>
  <svg id="bolt" viewBox="0 0 1000 1000" preserveAspectRatio="none"><path d=""/></svg>
  <div id="alarmfx"></div>
  <div id="splash"></div>
  <div id="hud"></div>
  <div id="o2"><i id="o2bar"></i><span>🫧 Oxygen</span></div>
  <div id="cur" class="cursor"><svg width="26" height="34" viewBox="0 0 24 32"><path d="M2 2v24l6-6 4 9 4-2-4-9h8z" fill="#fff" stroke="#10132a" stroke-width="2" stroke-linejoin="round"/></svg></div>
</div>
<div id="msg"></div>
<div id="end"></div>

<script>
/* =====================  helpers & DOM  ===================== */
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),pick=a=>a[Math.random()*a.length|0];
const st=$('stage'),cv=$('c'),cx=cv.getContext('2d'),cap=$('cap'),bw=$('bw'),btn=$('btn'),bub=$('bub'),cube=$('cube'),frost=$('frost'),dark=$('dark'),fl=$('flash'),bolt=$('bolt'),splash=$('splash'),hud=$('hud'),o2=$('o2'),o2bar=$('o2bar'),cur=$('cur'),msg=$('msg'),debEl=$('deb');
const CR=[...cube.querySelectorAll('.cr')];

/* =====================  texts  ===================== */
const B={1:'Come on, then — let’s see you catch a gale!',2:'Lights out. Good luck finding me. I can’t even find me.',3:'Frozen solid, still devastatingly handsome 🧊',4:'Blub blub… do you smell shark? 🏊',5:'It’s getting hot in here. Also, the floor is lava!'};
const MG={1:'Brilliant. Your frantic clicking tore a hole in the sky — lightning just struck the site’s power station!',2:'Great work. In the pitch dark you smashed the thermostat — it’s now 60 below zero!',3:'A sudden heatwave! The glaciers are collapsing and the whole site is going under!',4:'Millions of tons of water are crushing the bedrock… that’s a magnitude 9.0 earthquake!'};
const MM=[['🚨','Storm Warning','#ff4d4d'],['⚡','Grid Failure','#ffd23f'],['🥶','Arctic Blast','#6ee7ff'],['🌊','Flood Emergency','#3aa0ff'],['🌋','Magnitude 9.0','#ff7a1a']];
const SN=['','Storm','Darkness','Frost','Flood','Volcano'],SI=['','🌪️','🌩️','🧊','🌊','🌋'];
const SPL=[null,['STAGE 1','The Gale'],['STAGE 2','Total Blackout'],['STAGE 3','The Deep Freeze'],['STAGE 4','The Great Flood'],['STAGE 5','Volcano’s Wrath']];
const TA=['Missed! 😂','So close…','Swing and a miss','🤡','Far too slow','Not even close'];
const TK=['Seriously? 😂','Is that your best shot?','Right here, champ!','Focus up 🙄','My grandma clicks faster','Pathetic. Try again 🤣'];
const FL=['🐄','🪑','🚗','🐔','👟','🛋️','🧺'];
const TITLES=['Browser Stability Test','🌪️ Storm!','⚡ Blackout','🧊 Ice Age','🌊 Flood!','🌋 Volcano!','🏆 Site Destroyed'];
const TC=[0,'255,255,255','120,200,255','40,120,200','255,255,255','255,170,60'];

/* =====================  state  ===================== */
let W=0,H=0,S=0,t=0,dpr=1,last=performance.now();
let locked=false,sayLock=false,total=0,ok=0,miss=0,pity=false,t0=0,iceHits=0,ih=0,drown=0,oxy=100,level=0,tilt=0,cd=0,fT=0,tmr=0,wy=0,bx=0,by=0,rx=0,ry=0,pcx=0,ir=0,adT=0,fp=0,sk=-9,eyT=0,tE=0,FE=false,AD=null,msgT=0,bubT=0,bvx=3,bvy=2.2;
let SH=[],D=[],P=[],OB=[],TR=[],FK=[],deb=[];
let bs=1,bm=1,bmT=0,bst=0,rt=4,ff=false,adN=7,fpg=8,p4=0,q4=0,f4=1.3,g4=2.8,ivy=false,irG=3.5,tth=.85,fN=4.2;
const m={x:innerWidth/2,y:90},v={x:m.x,y:m.y},vel={x:0,y:0},off={x:0};
const CL=['#ffd23f','#6ee7ff'].map(col=>{const c=cur.cloneNode(true);c.removeAttribute('id');c.style.opacity='.55';c.style.display='none';c.querySelector('path').setAttribute('fill',col);st.appendChild(c);return c});

/* =====================  audio (Web Audio synth)  ===================== */
let ac,nb,master,wS,wG,muted=false;

function tone(f,dur,type,g,f2){if(!ac)return;const n=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+dur);gn.gain.setValueAtTime(g||.15,n);gn.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(gn);gn.connect(master);o.start();o.stop(n+dur)}

function update(dt){
  const sec=dt/60,a=1-.25*clamp(miss/30,0,1); /* a: 1 = normal, .5 = max assist after many misses */
  cd-=sec;bst-=sec;if(bmT>0){bmT-=sec;if(bmT<=0)bm=1}
  st.style.setProperty('--bs',bs*bm);
  if(S>0&&S<6&&!locked){rt-=sec;if(rt<=0){rt=R(2,5.5);chaos()}}
  if(S===4)level=Math.min(.75,level+sec*.2);
  if(S===5)level=Math.max(0,level-sec*.12);
  wy=H*(1-level);

  /* --- the (unreliable) fake cursor --- */
  if(S===1){
    off.x=Math.max(-Math.min(340,W*.36),off.x-(2.3+1.2*Math.sin(t*2.3)+Math.pow(Math.max(0,Math.sin(t*.8+Math.sin(t*.31)*4)),6)*5)*dt);
    v.x=m.x+off.x;v.y=m.y+Math.sin(t*1.9)*26+Math.sin(t*5.3)*9;if(wG)wG.gain.value=.12+.08*Math.sin(t*2);
  }else if(S===3){
    const f=Math.pow(.95,dt);
    vel.x+=(m.x-v.x)*.005*dt;vel.y+=(m.y-v.y)*.005*dt;vel.x*=f;vel.y*=f;v.x+=vel.x*dt;v.y+=vel.y*dt;
  }else if(S===4&&(v.y>wy||m.y>wy)){
    const k=1-Math.pow(1-.045,dt);v.x+=(m.x-v.x)*k;v.y+=(m.y-v.y)*k;
  }else{v.x=(S===5&&ir>0)?W-m.x:m.x;v.y=(S===5&&ir>0&&ivy)?H-m.y:m.y}
  v.x=clamp(v.x,0,W);v.y=clamp(v.y,0,H);
  cur.style.transform=`translate(${v.x}px,${v.y}px) rotate(${clamp((v.x-pcx)*1.2,-30,30)}deg)`;pcx=v.x;
  const ghost=S===3||S===5;
  CL[0].style.display=CL[1].style.display=ghost?'block':'none';
  if(ghost){CL[0].style.transform=`translate(${W-v.x}px,${v.y}px)`;CL[1].style.transform=`translate(${v.x}px,${H-v.y}px)`}
  TR.push(v.x,v.y);if(TR.length>36)TR.splice(0,2);

  /* --- popup ads + upside-down world --- */
  if(S===1||(S>=3&&S<=5)){adT+=sec;if(adT>adN&&!AD&&!locked){adT=0;mkAd()}}
  if(AD){AD.x+=AD.vx*dt;AD.y+=AD.vy*dt;if(AD.x<110||AD.x>W-110)AD.vx*=-1;if(AD.y<70||AD.y>H-70)AD.vy*=-1;AD.x=clamp(AD.x,110,W-110);AD.y=clamp(AD.y,70,H-70);AD.w.style.transform=`translate(${AD.x-105}px,${AD.y-64}px)`}
  if(S===4){fp-=sec;if(fp<-fpg){fp=R(2.5,4.5);fpg=R(3,8);pop(W/2,H*.3,'🙃 The world just flipped!')}}

  /* --- decoy buttons --- */
  for(const f of FK){
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.x<105){f.x=105;f.vx=Math.abs(f.vx)}if(f.x>W-105){f.x=W-105;f.vx=-Math.abs(f.vx)}
    if(f.y<110){f.y=110;f.vy=Math.abs(f.vy)}if(f.y>H-60){f.y=H-60;f.vy=-Math.abs(f.vy)}
    f.w.style.transform=`translate(${f.x}px,${f.y}px)`;
  }

  if(S===1)drawStorm(dt);else if(S===2)drawDark(dt);else if(S===3)drawIce(dt);else if(S===4)drawFlood(dt);else if(S===5)drawLava(dt);else if(S===6)drawSunrise();
  drawShards(dt);drawTrail();
}

/* =====================  main loop  ===================== */
function loop(now){const dt=Math.min(3,(now-last)/16.667);last=now;t+=dt/60;update(dt);draw(dt);requestAnimationFrame(loop)}
size();enter(0);requestAnimationFrame(loop);
</script>
